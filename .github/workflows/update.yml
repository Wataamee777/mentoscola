name: Update MentoScola JSON

on:
  workflow_dispatch:

permissions:
  contents: write   # ← これがないと push できない

jobs:
  update-json:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install node-fetch@3

      - name: Fetch user data from GAS
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          node -e "
          import fetch from 'node-fetch';
          import fs from 'fs';
          const res = await fetch(process.env.GAS_URL);
          const data = await res.json();
          fs.writeFileSync('user.json', JSON.stringify(data, null, 2));
          console.log('user.json updated from GAS');
          "

      - name: Generate ranking.json (Top 10)
        run: |
          node -e "
          import fs from 'fs';
          const users = JSON.parse(fs.readFileSync('user.json'));
          const ranking = users
            .sort((a,b)=>b.bestScore - a.bestScore)
            .slice(0,10)
            .map((u,i)=>({rank:i+1,name:u.name,score:u.bestScore}));
          fs.writeFileSync('ranking.json', JSON.stringify(ranking, null, 2));
          console.log('ranking.json generated (Top 10)');
          "

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add user.json ranking.json
          git commit -m "Update user.json & ranking.json via workflow" || echo "No changes"
          git push
